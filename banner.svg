<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9333ea;stop-opacity:1" />
    </linearGradient>
    <filter id="f1" x="0" y="0" width="200%" height="200%">
      <feOffset result="offOut" in="SourceAlpha" dx="5" dy="5" />
      <feGaussianBlur result="blurOut" in="offOut" stdDeviation="5" />
      <feBlend in="SourceGraphic" in2="blurOut" mode="normal" />
    </filter>
  </defs>
  <rect width="800" height="200" rx="15" fill="url(#grad1)" />
  
  <!-- Abstract Circuit Lines -->
  <path d="M 50 150 L 150 150 L 200 100 L 300 100" stroke="rgba(255,255,255,0.2)" stroke-width="2" fill="none" />
  <path d="M 50 50 L 150 50 L 200 100 L 300 100" stroke="rgba(255,255,255,0.2)" stroke-width="2" fill="none" />
  <circle cx="50" cy="150" r="5" fill="white" fill-opacity="0.5" />
  <circle cx="50" cy="50" r="5" fill="white" fill-opacity="0.5" />
  
  <path d="M 750 150 L 650 150 L 600 100 L 500 100" stroke="rgba(255,255,255,0.2)" stroke-width="2" fill="none" />
  <path d="M 750 50 L 650 50 L 600 100 L 500 100" stroke="rgba(255,255,255,0.2)" stroke-width="2" fill="none" />
  <circle cx="750" cy="150" r="5" fill="white" fill-opacity="0.5" />
  <circle cx="750" cy="50" r="5" fill="white" fill-opacity="0.5" />

  <!-- Text -->
  <text x="50%" y="45%" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" filter="url(#f1)">Awesome AI Benchmarking</text>
  <text x="50%" y="65%" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="rgba(255,255,255,0.9)">Top AI Benchmarking Tools &amp; Leaderboards Ecosystem</text>
  
  <!-- Decorative Elements -->
  <rect x="380" y="140" width="40" height="4" rx="2" fill="white" fill-opacity="0.8" />
</svg>
